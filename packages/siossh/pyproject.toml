[build-system]
requires = ["oryn~=2.1"]
build-backend = "oryn"

[project]
name = "siossh"
version = "1.0"
description = "Sans-IO SSH server"
license = "EUPL-1.2"
readme = "../../readme.md"
requires-python = "~=3.14"
dependencies = [
    "cryptography>=49.0",
    "umac~=2.0",
]

[project.optional-dependencies]
asyncio = [
    "aiodrive~=5.1",
]
textual = [
    "textual>=8.2.8",
]

[project.urls]
Repository = "https://github.com/slietar/siossh"

[tool.oryn]
include = ["src/*"]
