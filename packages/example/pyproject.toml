[build-system]
requires = ["oryn~=2.1"]
build-backend = "oryn"

[project]
name = "example"
version = "0.0"
requires-python = "~=3.14"
dependencies = [
    "aiodrive~=5.1",
    "httpx~=0.28.1",
    "polars~=1.43",
    "siossh[asyncio,textual]",
    "tailscale-py>=0.4.0",
    "textual>=8.2.8",
]

[tool.oryn]
include = ["src/*"]

[tool.uv.sources]
aiodrive = { path = "../../../aiodrive", editable = true }
siossh = { workspace = true }
