[project]
name = "aiossh"
version = "0.0"
requires-python = ">=3.14"
dependencies = [
    "aiodrive~=2.0",
    "cryptography~=46.0",
]

[tool.ruff]
indent-width = 2

[tool.ruff.lint]
preview = true
select = ["COM812", "COM818", "E", "F", "FURB", "I", "PTH", "Q", "RUF", "UP", "W"]
ignore = ["E111", "E114", "E201", "E202", "E251", "E261", "E266", "E302", "E303", "E305", "E306", "E501", "E731", "RUF029", "UP045"]

[tool.ruff.lint.flake8-quotes]
inline-quotes = "single"
multiline-quotes = "single"

[tool.ruff.lint.isort]
lines-after-imports = 2
